name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test core
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MKBSync
          path: dist/MKBSync.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MKBSync.zip
